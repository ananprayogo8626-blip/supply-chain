name: Deploy Subdomain Anan (FTP)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, zip, pdo, sqlite, pdo_sqlite

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-dev --no-interaction --optimize-autoloader

      - name: Compress Vendor Directory
        run: |
          zip -q -r vendor.zip vendor/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          timeout: 60000
          server-dir: /public_html/anan/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            .env
            storage/logs/*
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            vendor/**

      - name: Extract Vendor Zip on Server
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set. Skipping curl trigger. You can unzip vendor.zip manually via cPanel or set SITE_URL secret."
          else
            echo "Triggering extraction on server: https://${SITE_URL}/extract_vendor.php"
            curl -s -k "https://${SITE_URL}/extract_vendor.php?key=anan_supply_chain_secret_key_2026" || true
          fi
